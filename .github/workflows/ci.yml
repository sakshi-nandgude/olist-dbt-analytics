
name: dbt CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt and DuckDB
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb

      - name: Create CI database
        run: |
          python scripts/create_ci_database.py

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          olist_dbt_analytics:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ci_olist.duckdb
                threads: 1
          EOF

      - name: Check dbt connection
        run: dbt debug

      - name: Parse dbt project
        run: dbt parse

      - name: Build models and run tests
        run: dbt build
