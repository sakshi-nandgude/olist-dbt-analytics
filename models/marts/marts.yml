
version: 2

models:

  - name: dim_customers
    description: "Customer dimension containing historical purchasing behaviour and lifetime value."
    columns:
      - name: customer_unique_id
        tests:
          - unique
          - not_null

      - name: total_orders
        tests:
          - not_null

  - name: dim_products
    description: "Product dimension containing standardized product categories and physical attributes."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: "Central order-level fact table containing revenue, order status and delivery metrics."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

      - name: customer_unique_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id

      - name: order_revenue
        tests:
          - not_null

  - name: mart_monthly_revenue
    description: "Monthly business performance summary covering revenue, orders and delivery metrics."
    columns:
      - name: order_month
        tests:
          - unique
          - not_null

      - name: total_orders
        tests:
          - not_null
