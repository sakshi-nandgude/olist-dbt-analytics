
version: 2

models:

  - name: stg_customers
    description: "Cleaned customer information from Olist."
    columns:
      - name: customer_id
        description: "Unique customer record identifier."
        tests:
          - unique
          - not_null

      - name: customer_unique_id
        tests:
          - not_null

  - name: stg_orders
    description: "Cleaned order transactions and timestamps."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: order_status
        tests:
          - accepted_values:
              values:
                - delivered
                - shipped
                - invoiced
                - processing
                - created
                - approved
                - unavailable
                - canceled

  - name: stg_order_items
    description: "Cleaned order item transactions."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id

      - name: order_item_id
        tests:
          - not_null

  - name: stg_products
    description: "Cleaned product catalogue."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_payments
    description: "Cleaned payment transactions."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: payment_type
        tests:
          - accepted_values:
              values:
                - credit_card
                - boleto
                - voucher
                - debit_card
                - not_defined
